# Builds the API image and pushes it to GHCR.
#   dev-main -> ghcr.io/fishnation-tournament/fishyapi:dev
#   prod     -> ghcr.io/fishnation-tournament/fishyapi:prod
# Then deploys it to the dev or prod VM.
# Each build is also tagged <tag>-<commit sha> so a VM can be pinned/rolled back to a specific build.
name: Build image

on:
  push:
    branches: [dev-main, prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fishnation-tournament/fishyapi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick image tag
        id: tag
        run: echo "tag=${{ github.ref_name == 'prod' && 'prod' || 'dev' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-${{ github.sha }}
          # Links the package to this repo (inherits its visibility and access).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the self-hosted runner on the matching VM (see FishyInfra README).
  deploy:
    needs: build
    runs-on: [self-hosted, "${{ github.ref_name == 'prod' && 'fishnation-prod' || 'fishnation-dev' }}"]
    permissions:
      packages: read
    concurrency:
      group: deploy-${{ github.ref_name }}
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy api
        run: ~/FishyInfra/scripts/deploy.sh api

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
